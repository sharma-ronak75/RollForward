<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Roll Forward <-> Mobility Aid Donation Drive</title>
  <meta name="description" content="Fund wheelchairs, tricycles, crutches, artificial limbs and white canes for verified low-income people with disabilities.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%230b4ea2' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23ffc928'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="progress" aria-hidden="true"></div>
  <a href="#main" class="skip">Skip to content</a>

  <header class="topbar">
    <div class="topbar-in">
      <a href="#/" class="brand" aria-label="Roll Forward home">
        <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="16" cy="16" r="4" fill="var(--accent)"/></svg>
        <span>Roll Forward</span>
      </a>
      <nav id="nav" class="nav" aria-label="Main"></nav>
      <div class="tools" role="group" aria-label="Display settings">
        <button class="chip" id="text-smaller" aria-label="Smaller text">A-</button>
        <button class="chip" id="text-larger" aria-label="Larger text">A+</button>
        <button class="chip" id="theme-toggle" aria-label="Switch colour theme" title="Light / dark">Theme</button>
        <button class="chip" id="contrast-toggle" aria-pressed="false">Contrast</button>
        <a class="chip chip-solid" id="account-link" href="#/account">Sign in</a>
        <button class="chip menu-btn" id="menu-btn" aria-expanded="false" aria-controls="nav" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="footer">
    <div class="wrap">
      <strong>Roll Forward</strong> is a donation drive for disabled, elderly people with low-income source.
    </div>
  </footer>

  <div id="modal-root" class="modal-root"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="/js/constants.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/pages-home.js"></script>
  <script src="/js/pages-giving.js"></script>
  <script src="/js/pages-community.js"></script>
  <script src="/js/pages-account.js"></script>
  <script src="/js/forms.js"></script>
  <script src="/js/navigation.js"></script>
  <script src="/js/effects.js"></script>
</body>
</html>
